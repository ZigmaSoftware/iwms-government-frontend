# IWMS Government — nginx reverse proxy (runs on the HOST, not in a container)
#
# Routes:
#   /            -> frontend container (serve, port 3000)
#   /api/        -> backend container  (gunicorn, port 9001)
#   /admin/      -> backend container  (Django admin)
#
# Install: copy this file to /etc/nginx/sites-available/iwms-government.conf,
# then:
#   sudo ln -s /etc/nginx/sites-available/iwms-government.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace server_name below with your real domain once you have one;
# until then, "_" matches any Host header (including the bare IP).

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Backend — Django API, admin, swagger
    location /api/ {
        proxy_pass http://127.0.0.1:9001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:9001/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else — the frontend SPA
    location / {
        proxy_pass http://127.0.0.1:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
