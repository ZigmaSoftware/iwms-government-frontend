# IWMS Government — Apache reverse proxy (runs on the HOST, not in a container)
#
# Routes:
#   /            -> frontend container (serve, port 3000)
#   /api/        -> backend container  (gunicorn, port 9001)
#   /admin/      -> backend container  (Django admin)
#
# Requires these Apache modules (enable once):
#   sudo a2enmod proxy proxy_http
#
# Install: copy this file to /etc/apache2/sites-available/iwms-government.conf,
# then:
#   sudo a2ensite iwms-government.conf
#   sudo a2dissite 000-default.conf   # remove Apache's stock default site
#   sudo apachectl configtest && sudo systemctl reload apache2
#
# Replace ServerName below with your real domain once you have one;
# until then this VirtualHost matches any Host header on port 80
# (there's no ServerName directive, so it's the catch-all default vhost).

<VirtualHost *:80>
    # ServerName yourdomain.com

    ProxyPreserveHost On

    # Backend — Django API, admin, swagger
    ProxyPass /api/ http://127.0.0.1:9001/api/
    ProxyPassReverse /api/ http://127.0.0.1:9001/api/

    ProxyPass /admin/ http://127.0.0.1:9001/admin/
    ProxyPassReverse /admin/ http://127.0.0.1:9001/admin/

    # Everything else — the frontend SPA
    ProxyPass / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/

    RequestHeader set X-Forwarded-Proto "http"

    ErrorLog ${APACHE_LOG_DIR}/iwms-government-error.log
    CustomLog ${APACHE_LOG_DIR}/iwms-government-access.log combined
</VirtualHost>
